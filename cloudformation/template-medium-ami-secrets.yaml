AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Medium AMI CloudFormation template for launching an Orbs Boyar validator node
  from a pre-baked AMI while reading the private key from AWS Secrets Manager at first boot.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network configuration
        Parameters:
          - VpcId
          - SubnetId
          - SSHLocation
      - Label:
          default: EC2 configuration
        Parameters:
          - ImageId
          - InstanceType
          - VolumeSize
          - KeyName
      - Label:
          default: Orbs runtime configuration
        Parameters:
          - EthereumEndpoint
          - NodeAddressWithNoLeading0x
          - PrivateKeySecretArn
    ParameterLabels:
      ImageId:
        default: Medium AMI ID
      InstanceType:
        default: EC2 instance type
      VolumeSize:
        default: Root volume size GiB
      KeyName:
        default: EC2 Key Pair name
      VpcId:
        default: VPC ID
      SubnetId:
        default: Public subnet ID
      SSHLocation:
        default: Operator access CIDR
      EthereumEndpoint:
        default: Ethereum RPC endpoint
      NodeAddressWithNoLeading0x:
        default: Orbs node address without 0x
      PrivateKeySecretArn:
        default: Secrets Manager private key secret ARN

Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
    Default: ami-0bfc554348685c913
    Description: Region-local Medium AMI with Docker, Boyar binary, and /opt/orbs/ami_creator installer files pre-baked.

  InstanceType:
    Type: String
    Default: r5.large
    Description: EC2 instance type. Orbs documentation maps validator requirements to r5.large.
    AllowedPattern: '^[a-z][a-z0-9]*[0-9]*\.[a-z0-9]+$'
    ConstraintDescription: Must be a valid EC2 instance type, for example r5.large.

  VolumeSize:
    Type: Number
    Default: 256
    MinValue: 64
    MaxValue: 16384
    Description: Root EBS volume size in GiB. Orbs documentation recommends 256GB SSD or larger.

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 Key Pair for SSH access. For temporary tests, create a disposable key pair and delete it after stack cleanup.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the validator EC2 instance and Security Group will be created.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet where the validator EC2 instance will be launched. The template associates a public IPv4 address for this test.

  SSHLocation:
    Type: String
    Default: 127.0.0.1/32
    Description: CIDR allowed to access SSH and test status ports. Use your own public IP /32 for testing; do not leave this broad in production.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid IPv4 CIDR, for example 203.0.113.10/32.

  EthereumEndpoint:
    Type: String
    NoEcho: true
    Description: Ethereum RPC endpoint URL. May contain an API key; do not share stack parameters or logs externally.
    AllowedPattern: '^https?://.+'
    ConstraintDescription: Must start with http:// or https://.

  NodeAddressWithNoLeading0x:
    Type: String
    NoEcho: true
    Description: Orbs node Ethereum address without leading 0x. 40 hex characters. Marked NoEcho to reduce metadata exposure.
    AllowedPattern: '^[0-9a-fA-F]{40}$'
    ConstraintDescription: Must be 40 hex characters without 0x.

  PrivateKeySecretArn:
    Type: String
    Description: ARN of the AWS Secrets Manager secret containing the Orbs node private key as either a raw 64-hex string or a JSON value with PRIVATE_KEY_NO_LEADING_0x/privateKeyNoLeading0x/privateKey.
    AllowedPattern: '^arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+'
    ConstraintDescription: Must be a valid AWS Secrets Manager secret ARN.

Resources:
  OrbsBoyarInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: orbs-boyar-aws-launcher

  OrbsBoyarPrivateKeySecretReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-read-private-key-secret'
      Roles:
        - !Ref OrbsBoyarInstanceRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadOnlySpecifiedPrivateKeySecret
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref PrivateKeySecretArn

  OrbsBoyarInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref OrbsBoyarInstanceRole

  OrbsBoyarSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: KRYP Labs Orbs Boyar AWS Launcher access
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
          Description: SSH access from operator CIDR
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref SSHLocation
          Description: Boyar HTTP status endpoint from operator CIDR
        - IpProtocol: tcp
          FromPort: 7666
          ToPort: 7666
          CidrIp: !Ref SSHLocation
          Description: Management service status endpoint from operator CIDR
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow outbound Secrets Manager, Docker pulls, Orbs endpoints, and Ethereum RPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-orbs-boyar-medium-ami-secrets-sg'
        - Key: Project
          Value: orbs-boyar-aws-launcher

  OrbsBoyarInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref OrbsBoyarInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref OrbsBoyarSecurityGroup
          AssociatePublicIpAddress: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-orbs-boyar-medium-ami-secrets'
        - Key: Project
          Value: orbs-boyar-aws-launcher
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -Eeuo pipefail
          touch /var/log/orbs-boyar-cloudformation.log
          chmod 600 /var/log/orbs-boyar-cloudformation.log
          exec >> /var/log/orbs-boyar-cloudformation.log 2>&1

          log() {
            printf '[%s] %s\n' "$(date -Is)" "$1"
          }

          INSTALLER_DIR="/opt/orbs/ami_creator"
          ENV_FILE="${!INSTALLER_DIR}/.env"
          SECRET_ARN='${PrivateKeySecretArn}'
          AWS_REGION='${AWS::Region}'
          ETHEREUM_ENDPOINT_VALUE='${EthereumEndpoint}'
          NODE_ADDRESS_VALUE='${NodeAddressWithNoLeading0x}'

          log "Starting Orbs Boyar Medium AMI first-boot configuration with Secrets Manager"
          log "Fetching private key from Secrets Manager (secret value is not logged)"
          umask 077
          SECRET_ARN="${!SECRET_ARN}" AWS_REGION="${!AWS_REGION}" ETHEREUM_ENDPOINT_VALUE="${!ETHEREUM_ENDPOINT_VALUE}" NODE_ADDRESS_VALUE="${!NODE_ADDRESS_VALUE}" ENV_FILE="${!ENV_FILE}" python3 <<'PY'
          import datetime
          import hashlib
          import hmac
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          def fail(message):
              print(f"ERROR: {message}", file=sys.stderr)
              sys.exit(1)

          region = os.environ["AWS_REGION"]
          secret_arn = os.environ["SECRET_ARN"]
          env_file = os.environ["ENV_FILE"]
          ethereum_endpoint = os.environ["ETHEREUM_ENDPOINT_VALUE"]
          node_address = os.environ["NODE_ADDRESS_VALUE"]

          token_req = urllib.request.Request(
              "http://169.254.169.254/latest/api/token",
              method="PUT",
              headers={"X-aws-ec2-metadata-token-ttl-seconds": "21600"},
          )
          token = urllib.request.urlopen(token_req, timeout=5).read().decode()
          meta_headers = {"X-aws-ec2-metadata-token": token}
          role_name = urllib.request.urlopen(
              urllib.request.Request("http://169.254.169.254/latest/meta-data/iam/security-credentials/", headers=meta_headers),
              timeout=5,
          ).read().decode().strip()
          creds = json.loads(urllib.request.urlopen(
              urllib.request.Request(f"http://169.254.169.254/latest/meta-data/iam/security-credentials/{role_name}", headers=meta_headers),
              timeout=5,
          ).read().decode())

          access_key = creds["AccessKeyId"]
          secret_key = creds["SecretAccessKey"]
          session_token = creds["Token"]
          service = "secretsmanager"
          host = f"secretsmanager.{region}.amazonaws.com"
          endpoint = f"https://{host}/"
          target = "secretsmanager.GetSecretValue"
          payload = json.dumps({"SecretId": secret_arn}, separators=(",", ":")).encode()
          now = datetime.datetime.utcnow()
          amz_date = now.strftime("%Y%m%dT%H%M%SZ")
          date_stamp = now.strftime("%Y%m%d")
          canonical_uri = "/"
          canonical_querystring = ""
          canonical_headers = (
              f"content-type:application/x-amz-json-1.1\n"
              f"host:{host}\n"
              f"x-amz-date:{amz_date}\n"
              f"x-amz-security-token:{session_token}\n"
              f"x-amz-target:{target}\n"
          )
          signed_headers = "content-type;host;x-amz-date;x-amz-security-token;x-amz-target"
          payload_hash = hashlib.sha256(payload).hexdigest()
          canonical_request = "\n".join(["POST", canonical_uri, canonical_querystring, canonical_headers, signed_headers, payload_hash])
          algorithm = "AWS4-HMAC-SHA256"
          credential_scope = f"{date_stamp}/{region}/{service}/aws4_request"
          string_to_sign = "\n".join([algorithm, amz_date, credential_scope, hashlib.sha256(canonical_request.encode()).hexdigest()])

          def sign(key, msg):
              return hmac.new(key, msg.encode(), hashlib.sha256).digest()

          signing_key = sign(sign(sign(sign(("AWS4" + secret_key).encode(), date_stamp), region), service), "aws4_request")
          signature = hmac.new(signing_key, string_to_sign.encode(), hashlib.sha256).hexdigest()
          authorization = f"{algorithm} Credential={access_key}/{credential_scope}, SignedHeaders={signed_headers}, Signature={signature}"
          headers = {
              "Content-Type": "application/x-amz-json-1.1",
              "X-Amz-Date": amz_date,
              "X-Amz-Security-Token": session_token,
              "X-Amz-Target": target,
              "Authorization": authorization,
          }
          try:
              response = urllib.request.urlopen(urllib.request.Request(endpoint, data=payload, headers=headers, method="POST"), timeout=20)
              secret_response = json.loads(response.read().decode())
          except urllib.error.HTTPError as exc:
              fail(f"Secrets Manager GetSecretValue failed with HTTP {exc.code}")

          if "SecretString" not in secret_response:
              fail("secret must contain SecretString")
          secret_string = secret_response["SecretString"].strip()
          private_key = secret_string
          try:
              parsed = json.loads(secret_string)
              if isinstance(parsed, dict):
                  for key in ("PRIVATE_KEY_NO_LEADING_0x", "privateKeyNoLeading0x", "privateKey"):
                      if parsed.get(key):
                          private_key = str(parsed[key]).strip()
                          break
          except json.JSONDecodeError:
              pass
          if private_key.startswith("0x"):
              private_key = private_key[2:]
          if not re.fullmatch(r"[0-9a-fA-F]{64}", private_key):
              fail("private key from Secrets Manager must be 64 hex characters, with optional 0x accepted")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", node_address):
              fail("node address must be 40 hex characters without 0x")
          if not re.match(r"^https?://.+", ethereum_endpoint):
              fail("Ethereum endpoint must start with http:// or https://")
          with open(env_file, "w") as f:
              f.write(f"ETHEREUM_ENDPOINT={ethereum_endpoint}\n")
              f.write(f"NODE_ADDRESS_WITH_NO_LEADING_0x={node_address}\n")
              f.write(f"PRIVATE_KEY_NO_LEADING_0x={private_key}\n")
          os.chown(env_file, 0, 0)
          os.chmod(env_file, 0o600)
          print("Runtime environment file written with private key redacted from logs")
          PY

          log "Running install.sh --configure-and-start with ORBS_ENV_FILE override"
          ORBS_ENV_FILE="${!ENV_FILE}" "${!INSTALLER_DIR}/install.sh" --configure-and-start
          log "Orbs Boyar Medium AMI Secrets Manager first-boot configuration completed"

Outputs:
  InstanceId:
    Description: EC2 instance ID
    Value: !Ref OrbsBoyarInstance

  PublicIp:
    Description: Public IPv4 address assigned to the instance
    Value: !GetAtt OrbsBoyarInstance.PublicIp

  BoyarStatusUrl:
    Description: Boyar status endpoint
    Value: !Sub 'http://${OrbsBoyarInstance.PublicIp}/services/boyar/status'

  ManagementStatusUrl:
    Description: Management service direct status endpoint
    Value: !Sub 'http://${OrbsBoyarInstance.PublicIp}:7666/status'

  InstanceRoleName:
    Description: EC2 IAM role name used for the Secrets Manager test.
    Value: !Ref OrbsBoyarInstanceRole

  PrivateKeySecretArnUsed:
    Description: Secret ARN used by the EC2 instance role policy. Secret value is never output.
    Value: !Ref PrivateKeySecretArn

  SSHCommand:
    Description: Example SSH command. Replace key path with your local private key file path.
    Value: !Sub 'ssh -i <path-to-${KeyName}.pem> ubuntu@${OrbsBoyarInstance.PublicIp}'
